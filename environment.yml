# conda env create -f environment.yml && conda activate mfa-refine
# Everything runs on CPU. torch/torchaudio come from conda-forge so they share one OpenMP
# runtime with MFA (pip torch + conda MFA crashes on macOS with "OMP: Error #15").
name: mfa-refine
channels:
  - conda-forge
dependencies:
  - python=3.11
  - montreal-forced-aligner=3.4
  - pytorch=2.8
  - torchaudio=2.8   # 2.9 removed the forced-alignment API used for the cross-check
  - numpy
  - scipy
  - pysoundfile
  - rapidfuzz
  - pytest
  - pip
  - pip:
      - faster-whisper
      - -e .
